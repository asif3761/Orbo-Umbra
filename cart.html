<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Satchel — Ordo Umbra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2620"/>
      <stop offset="45%" stop-color="#d8d2c4"/>
      <stop offset="100%" stop-color="#fdf8ec"/>
    </linearGradient>
  </defs>
</svg>

<div id="assassin-cursor">
  <svg width="64" height="64" viewBox="0 0 64 64">
    <defs>
      <linearGradient id="cursorBladeGrad" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#2a2620"/>
        <stop offset="45%" stop-color="#d8d2c4"/>
        <stop offset="100%" stop-color="#fdf8ec"/>
      </linearGradient>
      <linearGradient id="cursorSkinGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#dcc7a4"/>
        <stop offset="100%" stop-color="#a98a63"/>
      </linearGradient>
    </defs>
    <g class="hand-grip">
      <rect x="22" y="30" width="16" height="30" rx="4" fill="#3a281c" stroke="#181008" stroke-width="1"/>
      <rect x="21" y="35" width="18" height="3" fill="#a9803f"/>
      <rect x="21" y="46" width="18" height="3" fill="#a9803f"/>
      <path d="M22 30 C18 27 16 22 18 17 C19 14 22 13 23 16 C23 12 26 10 28 13 C28 10 31 9 32 12 C33 10 36 11 35 14 C38 15 38 19 36 22 L30 30 Z"
            fill="url(#cursorSkinGrad)" stroke="#181008" stroke-width="1"/>
    </g>
    <g class="blade">
      <path d="M30 26 L58 6 L54 4 L28 22 Z" fill="url(#cursorBladeGrad)" stroke="#181008" stroke-width="0.8"/>
      <line class="glint" x1="33" y1="22" x2="53" y2="8" stroke="#fdf8ec" stroke-width="1"/>
    </g>
  </svg>
</div>

<nav>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z" stroke="url(#bladeGrad)" stroke-width="1.2" fill="none"/><path d="M12 7v10M9 10l3-3 3 3" stroke="url(#bladeGrad)" stroke-width="1" fill="none"/></svg>
    ORDO&nbsp;UMBRA
  </div>
  <div class="navlinks">
    <a href="index.html">Home</a>
    <a href="armory.html">The Armory</a>
    <a href="index.html#creed">The Creed</a>
    <a href="cart.html" class="cart-link active" aria-label="Cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 6h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.3h7.6a1.5 1.5 0 0 0 1.5-1.2L20 9H7"/><circle cx="10" cy="20.5" r="1"/><circle cx="17" cy="20.5" r="1"/></svg>
      <span class="cart-badge">0</span>
    </a>
  </div>
</nav>

<div class="page-header">
  <h1 class="reveal">Your Satchel</h1>
  <p class="reveal">What you carry is what you're prepared to finish.</p>
</div>

<section style="padding-top:0;">
  <div class="reveal in-view" id="cart-root"></div>
</section>

<footer>
  <div>© Ordo Umbra — A fictional order. All craft is imagined.</div>
  <div class="foot-links">
    <a href="index.html#creed">The Creed</a>
    <a href="armory.html">The Armory</a>
    <a href="cart.html">The Cart</a>
  </div>
</footer>

<script src="assets/data/products.js"></script>
<script src="assets/js/cart.js"></script>
<script>
function renderCart(){
  const lines = ordoCartLines();
  const root = document.getElementById('cart-root');

  if(lines.length === 0){
    root.innerHTML = `
      <div class="cart-empty">
        The satchel is empty.<br><br>
        <a class="btn" href="armory.html">Visit the Armory</a>
      </div>
    `;
    return;
  }

  const rows = lines.map(l => `
    <tr>
      <td>
        <div class="cart-row-name">
          <div class="cart-row-icon">${l.icon}</div>
          <div>
            <div class="cart-row-title">${l.name}</div>
            <button class="cart-remove" onclick="ordoRemoveFromCart('${l.id}'); renderCart();">remove</button>
          </div>
        </div>
      </td>
      <td>${ordoFormatPrice(l.price)}</td>
      <td>
        <div class="qty-stepper">
          <button type="button" onclick="ordoSetQty('${l.id}', ${l.qty - 1 || 1}); renderCart();">−</button>
          <input type="text" value="${l.qty}" inputmode="numeric"
                 onchange="ordoSetQty('${l.id}', parseInt(this.value,10)||1); renderCart();">
          <button type="button" onclick="ordoSetQty('${l.id}', ${l.qty + 1}); renderCart();">+</button>
        </div>
      </td>
      <td style="text-align:right;">${ordoFormatPrice(l.lineTotal)}</td>
    </tr>
  `).join('');

  const total = ordoCartTotal();

  root.innerHTML = `
    <table class="cart-table">
      <thead>
        <tr><th>Item</th><th>Price</th><th>Quantity</th><th style="text-align:right;">Total</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="cart-summary">
      <div class="line"><span>Subtotal</span><span>${ordoFormatPrice(total)}</span></div>
      <div class="total">Total: ${ordoFormatPrice(total)}</div>
      <div style="margin-top:1.5rem; display:flex; gap:1rem;">
        <a class="btn" href="armory.html">Continue Browsing</a>
        <a class="btn btn-fill" href="checkout.html">Proceed to Checkout</a>
      </div>
    </div>
  `;
}
renderCart();
</script>
<script src="assets/js/reveal.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/transitions.js"></script>
</body>
</html>
