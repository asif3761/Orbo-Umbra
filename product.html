<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — Ordo Umbra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2620"/>
      <stop offset="45%" stop-color="#d8d2c4"/>
      <stop offset="100%" stop-color="#fdf8ec"/>
    </linearGradient>
  </defs>
</svg>

<div id="assassin-cursor">
  <svg width="64" height="64" viewBox="0 0 64 64">
    <defs>
      <linearGradient id="cursorBladeGrad" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#2a2620"/>
        <stop offset="45%" stop-color="#d8d2c4"/>
        <stop offset="100%" stop-color="#fdf8ec"/>
      </linearGradient>
      <linearGradient id="cursorSkinGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#dcc7a4"/>
        <stop offset="100%" stop-color="#a98a63"/>
      </linearGradient>
    </defs>
    <g class="hand-grip">
      <rect x="22" y="30" width="16" height="30" rx="4" fill="#3a281c" stroke="#181008" stroke-width="1"/>
      <rect x="21" y="35" width="18" height="3" fill="#a9803f"/>
      <rect x="21" y="46" width="18" height="3" fill="#a9803f"/>
      <path d="M22 30 C18 27 16 22 18 17 C19 14 22 13 23 16 C23 12 26 10 28 13 C28 10 31 9 32 12 C33 10 36 11 35 14 C38 15 38 19 36 22 L30 30 Z"
            fill="url(#cursorSkinGrad)" stroke="#181008" stroke-width="1"/>
    </g>
    <g class="blade">
      <path d="M30 26 L58 6 L54 4 L28 22 Z" fill="url(#cursorBladeGrad)" stroke="#181008" stroke-width="0.8"/>
      <line class="glint" x1="33" y1="22" x2="53" y2="8" stroke="#fdf8ec" stroke-width="1"/>
    </g>
  </svg>
</div>

<nav>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V6l-8-4z" stroke="url(#bladeGrad)" stroke-width="1.2" fill="none"/><path d="M12 7v10M9 10l3-3 3 3" stroke="url(#bladeGrad)" stroke-width="1" fill="none"/></svg>
    ORDO&nbsp;UMBRA
  </div>
  <div class="navlinks">
    <a href="index.html">Home</a>
    <a href="armory.html">The Armory</a>
    <a href="index.html#creed">The Creed</a>
    <a href="cart.html" class="cart-link" aria-label="Cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 6h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.3h7.6a1.5 1.5 0 0 0 1.5-1.2L20 9H7"/><circle cx="10" cy="20.5" r="1"/><circle cx="17" cy="20.5" r="1"/></svg>
      <span class="cart-badge">0</span>
    </a>
  </div>
</nav>

<main id="product-root">
  <!-- filled by script -->
</main>

<footer>
  <div>© Ordo Umbra — A fictional order. All craft is imagined.</div>
  <div class="foot-links">
    <a href="index.html#creed">The Creed</a>
    <a href="armory.html">The Armory</a>
    <a href="cart.html">The Cart</a>
  </div>
</footer>

<script src="assets/data/products.js"></script>
<script src="assets/js/cart.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const id = params.get('id');
const product = ORDO_PRODUCTS.find(p => p.id === id);
const root = document.getElementById('product-root');

if(!product){
  root.innerHTML = `
    <div class="page-header reveal">
      <h1>That blade isn't in the armory.</h1>
      <p>It may have been retired, or the link is broken.</p>
      <div style="margin-top:2rem;"><a class="btn" href="armory.html">Return to the Armory</a></div>
    </div>
  `;
} else {
  document.title = product.name + ' — Ordo Umbra';
  root.innerHTML = `
    <div class="page-header" style="padding-bottom:1rem;">
      <div class="product-layout">
        <div class="product-frame reveal">
          <div class="item-mark">${product.icon}</div>
        </div>
        <div class="product-info reveal">
          <div class="eyebrow">THE ARMORY</div>
          <h1>${product.name}</h1>
          <span class="price">${ordoFormatPrice(product.price)}</span>
          <p class="desc">${product.desc}</p>
          <div class="qty-row">
            <div class="qty-stepper">
              <button type="button" id="qty-dec" aria-label="Decrease quantity">−</button>
              <input type="text" id="qty-input" value="1" inputmode="numeric" aria-label="Quantity">
              <button type="button" id="qty-inc" aria-label="Increase quantity">+</button>
            </div>
          </div>
          <div class="product-actions">
            <button class="btn btn-fill" id="add-to-cart-btn">Acquire This Blade</button>
            <a class="btn" href="cart.html">View Cart</a>
          </div>
        </div>
      </div>
    </div>
  `;

  const qtyInput = document.getElementById('qty-input');
  document.getElementById('qty-dec').addEventListener('click', ()=>{
    qtyInput.value = Math.max(1, (parseInt(qtyInput.value,10)||1) - 1);
  });
  document.getElementById('qty-inc').addEventListener('click', ()=>{
    qtyInput.value = (parseInt(qtyInput.value,10)||1) + 1;
  });
  document.getElementById('add-to-cart-btn').addEventListener('click', ()=>{
    const qty = Math.max(1, parseInt(qtyInput.value,10) || 1);
    ordoAddToCart(product.id, qty);
  });
}
</script>
<script src="assets/js/reveal.js"></script>
<script src="assets/js/cursor.js"></script>
<script src="assets/js/transitions.js"></script>
</body>
</html>
